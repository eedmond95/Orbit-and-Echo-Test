<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#030308">
  <title>Orbit &amp; Echo — Boss Invasion</title>
  <style>
    html,body {margin:0;width:100%;height:100%;background:#030308;color:#d8eaff;font-family:system-ui,sans-serif;overflow:hidden}
    #loading {position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:26px}
    .orb {width:54px;height:54px;border:4px solid #27344b;border-top-color:#83eaff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 22px;box-shadow:0 0 26px #32c2ed60}
    .title {font-weight:900;text-transform:uppercase;letter-spacing:3px;color:#80eeff}
    .sub {font-size:12px;color:#9da9bf;margin-top:12px}
    a {color:#80eeff}
    @keyframes spin {to {transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div><div class="orb"></div><div class="title">Orbit &amp; Echo</div><div class="sub">Preparing the boss invasion...</div></div>
  </div>
  <script>
  (async function () {
    const display = document.getElementById('loading');
    try {
      const response = await fetch('./game-original.html?v=3.2', {cache:'no-store'});
      if (!response.ok) throw new Error('Game source returned ' + response.status);
      let page = await response.text();
      if (!/<\/body>/i.test(page)) throw new Error('Invalid game source');
      // Load the expansion after the original non-module engine: its game state,
      // pilots, physics, leaderboard, and artwork remain unchanged.
      const expansionTag = '<script src="./boss-events.js?v=3.2"></' + 'script>' + '<script src="./experience.js?v=1.1"></' + 'script>';
      page = page.replace(/<\/body>/i, expansionTag + '\n</body>');
      document.open();
      document.write(page);
      document.close();
    } catch (error) {
      console.error('Orbit & Echo loading error:', error);
      display.innerHTML = '<div><div class="title">Unable to load game</div><p class="sub">Check your internet connection and reload the page.</p><p><a href="./game-original.html">Open original game</a></p></div>';
    }
  })();
  </script>
</body>
</html>
